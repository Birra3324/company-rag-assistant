services:
  api:
    build: .
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY:?Set API_KEY before starting the API}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-sqlite}
      VECTOR_STORE_PATH: /app/data/vectorstore/rag.sqlite3
      DOCS_PATH: /app/data/sample_docs
      AUTO_INGEST_ON_STARTUP: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_TOP_K: ${MAX_TOP_K:-12}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - rag-index:/app/data/vectorstore

volumes:
  rag-index:
